[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mockserve"
version = "1.0.0"
description = "Zero-dependency JSON-configured API mock server for testing and development"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "ovannesovannisian-coder", email = "contact@datascrape.pro"},
]
keywords = ["api-mock", "mock-server", "testing", "json", "http", "development"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ovannesovannisian-coder/mockserve"
Repository = "https://github.com/ovannesovannisian-coder/mockserve"

[tool.setuptools.packages.find]
include = ["src*"]
